<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The Name of a Tactic Proves Nothing — Why Communism?</title>
<meta name="description" content="Principle, strategy, conditions, and the judgment of action">
<link rel="canonical" href="https://whycommunism.com/studies/organizing-and-learning/principle-strategy-and-tactic/">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3"><link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3"><link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=3"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#efe8d8;color:#262016;font-family:"Source Serif","Source Serif 4",Georgia,serif;
font-size:19px;line-height:1.8;min-height:100vh}
a{color:inherit}
.nav{padding:16px 20px;font-family:"IBM Plex Mono","Plex Mono",ui-monospace,monospace;
font-size:12.5px;letter-spacing:.14em}
.nav a{color:#6d6353;text-decoration:none;border-bottom:1px solid rgba(109,99,83,.4)}
.nav a:hover{color:#a5231d;border-color:#a5231d}
.inc{max-width:760px;margin:0 auto;padding:16vh 22px 60px;text-align:center}
.inc h1{font-weight:600;font-size:clamp(34px,6vw,52px)}
.aname{margin-top:14px;font-family:"IBM Plex Mono","Plex Mono",ui-monospace,monospace;
font-size:12px;letter-spacing:.18em;color:#6d6353;text-transform:uppercase}
.arcbtn{margin-top:36px;display:inline-block;border:1px solid #6d6353;background:none;
color:#262016;cursor:pointer;font-family:"IBM Plex Mono","Plex Mono",ui-monospace,monospace;
font-size:13px;letter-spacing:.1em;padding:12px 26px}
.arcbtn:hover{color:#a5231d;border-color:#a5231d}
.arcbtn:focus,.arcbtn:focus-visible{outline:none}
#arc{margin:40px auto 0;max-width:720px;text-align:left}
.arcpane{background:#313338;border-radius:8px;padding:18px 16px;color:#dbdee1;
font-family:"gg sans","Noto Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
font-size:15.5px;line-height:1.55}
.arcmsg{display:flex;gap:14px;padding:8px 8px;border-radius:4px}
.arcmsg:hover{background:#2e3035}
.arcav{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-weight:600;color:#fff;font-size:16px;overflow:hidden}
.arcav img{width:100%;height:100%;object-fit:cover}
.arcbody{min-width:0;flex:1}
.archead{display:flex;align-items:baseline;gap:8px}
.arcname{font-weight:600;color:#f2f3f5}
.arctime{font-size:11.5px;color:#949ba4}
.arctext{white-space:pre-wrap;word-wrap:break-word;color:#dbdee1}
.arctext a{color:#00a8fc;text-decoration:none}
.arctext a:hover{text-decoration:underline}
.arcnote{text-align:center;font-style:italic;color:#6d6353;padding:8px 0}
@media(max-width:600px){.inc{padding-top:12vh}.arcpane{padding:12px 8px}}
</style>
</head>
<body>
<nav class="nav"><a href="/">why communism?</a></nav>
<main class="inc">
<h1>Article incoming</h1>
<p class="aname">The Name of a Tactic Proves Nothing</p>
<button class="arcbtn" id="arcbtn" type="button">the archive</button>
<section id="arc" hidden></section>
</main>
<script>
(function(){
"use strict";
var btn=document.getElementById('arcbtn'),arc=document.getElementById('arc'),loaded=false;
function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML}
function linkify(s){return s.replace(/https?:\/\/[^\s<]+/g,function(u){
return '<a href="'+u+'" rel="noopener noreferrer" target="_blank">'+u+'</a>'})}
function nameOf(m){var a=m.author||m.user||{};
if(typeof a==='string')return a;
return a.displayName||a.globalName||a.username||a.name||'unknown'}
function timeOf(m){var t=m.timestamp||m.createdAt||m.date||'';
if(!t)return'';var d=new Date(t);return isNaN(d)?String(t):d.toLocaleString()}
function avatarOf(m,name){var a=m.author||m.user||{};
var url=a.avatarUrl||a.avatarURL||'';
if(url)return '<span class="arcav"><img src="'+esc(url)+'" alt=""></span>';
var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;
var hue=h%360;
return '<span class="arcav" style="background:hsl('+hue+',35%,45%)">'+esc(name.charAt(0).toUpperCase())+'</span>'}
function note(t){arc.innerHTML='<p class="arcnote">'+esc(t)+'</p>'}
btn.addEventListener('click',function(){
if(arc.hidden){arc.hidden=false;if(!loaded)load()}
else arc.hidden=true});
function load(){
loaded=true;note('opening the archive…');
fetch('https://archive.whycommunism.com/v2/topic?path='+encodeURIComponent(location.pathname))
.then(function(r){if(!r.ok)throw new Error(String(r.status));return r.json()})
.then(function(p){
var ms=p.records||p.sources||p.messages||(p.archive&&p.archive.messages)||p.items||[];
if(!ms.length){note('the archive is being prepared.');return}
var out=['<div class="arcpane">'];
ms.forEach(function(m){
var name=nameOf(m);
var content=m.content||m.body||m.text||'';
out.push('<div class="arcmsg">'+avatarOf(m,name)+
'<div class="arcbody"><div class="archead"><span class="arcname">'+esc(name)+
'</span><span class="arctime">'+esc(timeOf(m))+'</span></div>'+
'<div class="arctext">'+linkify(esc(content))+'</div></div></div>')});
out.push('</div>');
arc.innerHTML=out.join('')})
.catch(function(){note('the archive is being prepared.')})}
})();
</script>
<script src="/assets/authorship.js" defer></script>
</body>
</html>
